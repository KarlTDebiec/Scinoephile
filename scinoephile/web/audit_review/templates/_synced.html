{% include '_save_status.html' %}
<input id="version-{{ row.key }}" type="hidden" name="version" value="{{ row.version }}" hx-swap-oob="outerHTML">
{% set differences = row.differences %}
<pre id="original-diff-{{ row.key }}" hx-swap-oob="outerHTML">{% for text, kind in differences[0] %}<span class="diff-{{ kind }}">{{ text }}</span>{% endfor %}</pre>
<pre id="proofread-diff-{{ row.key }}" aria-hidden="true" hx-swap-oob="outerHTML">{% for text, kind in differences[1] %}<span class="diff-{{ kind }}">{{ text }}</span>{% endfor %}</pre>
