{% macro number_line(image, label, description_id) -%}
  <picture class="number-line">
    <source media="(prefers-color-scheme: dark)" srcset="{{ image.dark_url }}">
    <img src="{{ image.light_url }}"
         alt="{{ label }}"
         aria-describedby="{{ description_id }}"
         width="{{ image.width }}"
         height="{{ image.height }}"
         loading="lazy">
  </picture>
{%- endmacro %}
