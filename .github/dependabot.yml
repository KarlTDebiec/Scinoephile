version: 2

registries:
  paddle-cuda-wheels:
    type: python-index
    url: https://paddle-whl.cdn.bcebos.com

updates:
  - package-ecosystem: uv
    directory: /
    registries:
      - paddle-cuda-wheels
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
