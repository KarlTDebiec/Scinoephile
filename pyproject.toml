[project]
name = "scinoephile"
version = "0.1.0"
description = ""
authors = [
    { name = "Karl Debiec", email = "karl.t.debiec@gmail.com" }
]
license = "BSD-3-Clause"
license-files = [
    "LICENSE",
    "docs/THIRD_PARTY_NOTICES.md",
]
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiofiles>=25.1.0",
    "audioop-lts>=0.2.2",
    "beautifulsoup4>=4.15.0",
    "ffmpeg-python>=0.2.0",
    "hkscs-unicode-converter>=1.1.0",
    "jieba>=0.42.1",
    "numba>=0.67.0",
    "numpy>=2.5.2",
    "openai>=2.53.0",
    "opencc>=1.4.1",
    "pillow>=12.3.0",
    "pycantonese>=5.0.0",
    "pydantic>=2.13.4",
    "pydub>=0.25.1",
    "pypinyin>=0.55.0",
    "pysubs2>=1.9.0",
    "requests>=2.34.2",
    "setuptools>=83.0.0",
    "sqlalchemy>=2.0.52",
    "typing-extensions>=4.16.0",
]

[project.optional-dependencies]
ocr = [
    "chrome-lens-py>=3.4.5",
    "paddleocr>=3.1.0",
    "paddlepaddle @ git+https://github.com/PaddlePaddle/Paddle.git@abadcba928490aae564260a1eefc5a7279db5f3e ; (platform_machine == 'arm64' and sys_platform == 'darwin') or (platform_machine == 'x86_64' and sys_platform == 'linux') or (platform_machine == 'AMD64' and sys_platform == 'win32')",
]
ocr-cuda = [
    "chrome-lens-py>=3.4.5",
    "paddleocr>=3.1.0",
    "paddlepaddle-gpu @ git+https://github.com/PaddlePaddle/Paddle.git@abadcba928490aae564260a1eefc5a7279db5f3e ; platform_machine == 'AMD64' and sys_platform == 'win32'",
]
transcription = [
    "demucs-infer>=4.2.2",
    "fireredasr2s @ git+https://github.com/FireRedTeam/FireRedASR2S.git@4e7d9aaf4482a47cec1724807026b9b151926eb5",
    "huggingface-hub>=1.27.0",
    "kaldi-native-fbank>=1.22.3",
    "mlx-audio @ git+https://github.com/ailuntx/mlx-audio@ff0197c0ae9f9fd02072904c696f2533e329c06e ; platform_machine == 'arm64' and sys_platform == 'darwin'",
    "onnxruntime>=1.28.0",
    "pyannote.audio>=4.0.7,<5.0.0",
    "silero-vad>=6.2.1",
    "ten-vad>=1.0.6.8",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "transformers>=5.15.0",
    "whisper-timestamped>=1.15.9",
]
web = [
    "flask>=3.1.3",
]

[project.scripts]
scinoephile = "scinoephile.cli.scinoephile_cli:ScinoephileCli.main"

[dependency-groups]
ocr-cuda = [
    "chrome-lens-py>=3.4.5",
    "paddleocr>=3.1.0",
    "paddlepaddle-gpu @ git+https://github.com/PaddlePaddle/Paddle.git@abadcba928490aae564260a1eefc5a7279db5f3e ; platform_machine == 'AMD64' and sys_platform == 'win32'",
]
paddle-build = [
    "cmake>=3.22,<4",
    "jinja2>=3.1.6",
    "ninja>=1.13.0",
    "pip>=25.3",
    "pybind11-stubgen==2.5.5",
    "pyyaml>=6.0.2",
    "wheel>=0.45.1",
]
dev = [
    "flask>=3.1.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-github-actions-annotate-failures>=0.4.2",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.1",
    "ty>=0.0.90",
]

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
filterwarnings = [
    'ignore:invalid escape sequence .*\\\(:SyntaxWarning',
    "ignore:Couldn't find ffmpeg or avconv - defaulting to ffmpeg, but may not work:RuntimeWarning:pydub\\.utils",
]

[tool.ruff]
line-length = 88

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = [
    "D", # pydocstyle
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
    "N", # pep8-naming
    "NPY", # numpy-specific rules
    "PERF", # perflint
    "PL", # pylint
    "UP", # pyupgrade
    "W", # pycodestyle
]
ignore = [
    "D410", # Missing blank line after section
    "D411", # Missing blank line before section
    "PLR0913", # Too many arguments in function definition
    "PLR0917", # Too many positional arguments
    "PLR2004" # Magic value used in comparison
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = 'google'

[tool.ty.analysis]
allowed-unresolved-imports = [
    "chrome_lens_py",
    "chrome_lens_py.**",
    "demucs_infer",
    "demucs_infer.**",
    "fireredasr2s",
    "fireredasr2s.**",
    "huggingface_hub",
    "huggingface_hub.**",
    "mlx_audio",
    "mlx_audio.**",
    "paddleocr",
    "pyannote",
    "pyannote.**",
    "silero_vad",
    "silero_vad.**",
    "ten_vad",
    "torch",
    "torch.**",
    "torchaudio",
    "torchaudio.**",
    "transformers",
    "whisper",
    "whisper.**",
    "whisper_timestamped",
    "whisper_timestamped.**",
]

[tool.setuptools]
include-package-data = true
packages = { find = { include = ["scinoephile*"] } }

[tool.setuptools.package-data]
scinoephile = [
    "data/*.md",
    "data/dictionaries/kaifangcidian/*.csv",
    "data/dictionaries/unihan/*.txt",
    "data/ocr/*.csv",
    "web/static/*.js",
    "web/ocr_validation/templates/*.html",
]

[tool.uv]
no-build-isolation-package = ["paddlepaddle", "paddlepaddle-gpu"]
override-dependencies = [
    "numpy>=2.5.2",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
    "transformers>=5.15.0",
]
package = true

[tool.uv.extra-build-variables]
paddlepaddle = { GENERATOR = "Ninja", PADDLE_VERSION = "3.5.0.dev20261104+abadcba9284", WITH_DISTRIBUTE = "OFF", WITH_GPU = "OFF", WITH_TESTING = "OFF" }
paddlepaddle-gpu = { GENERATOR = "Ninja", PADDLE_VERSION = "3.5.0.dev20261104+abadcba9284", WITH_DISTRIBUTE = "OFF", WITH_GPU = "ON", WITH_PIP_CUDA_LIBRARIES = "OFF", WITH_TESTING = "OFF" }

[[tool.uv.dependency-metadata]]
name = "paddlepaddle"
version = "3.5.0.dev20261104+abadcba9284"
requires-python = ">=3.10"
requires-dist = [
    "httpx",
    "numpy>=1.21",
    "protobuf>=3.20.2",
    "Pillow",
    "opt_einsum==3.3.0",
    "networkx",
    "packaging",
    "typing_extensions",
    "safetensors>=0.6.0",
    "setuptools; python_version >= '3.12'",
]

[[tool.uv.dependency-metadata]]
name = "paddlepaddle-gpu"
version = "3.5.0.dev20261104+abadcba9284"
requires-python = ">=3.10"
requires-dist = [
    "httpx",
    "numpy>=1.21",
    "protobuf>=3.20.2",
    "Pillow",
    "opt_einsum==3.3.0",
    "networkx",
    "packaging",
    "typing_extensions",
    "safetensors>=0.6.0",
    "setuptools; python_version >= '3.12'",
]
